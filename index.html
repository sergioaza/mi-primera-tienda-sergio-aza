<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap");

    :root {
      --fondo: #14111f;
      --superficie: #1f1a33;
      --texto: #ece9f7;
      --texto-suave: #a79fc4;
      --magenta: #ff2e88;
      --cyan: #19e3ff;
      --violeta: #7a4dff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
      color: var(--texto);
      text-align: center;
      margin: 0;
      padding: 24px 20px 48px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 46, 136, 0.22), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(25, 227, 255, 0.18), transparent 40%),
        var(--fondo);
      background-attachment: fixed;
    }

    h1, h2 { font-weight: 700; letter-spacing: 0.02em; }

    h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      margin: 8px 0 12px;
      background: linear-gradient(90deg, var(--magenta), var(--violeta), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .slogan { margin: 0 0 8px; font-size: 1.1rem; }

    .beneficios {
      display: flex;
      gap: 8px 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 0 0 32px;
      color: var(--texto-suave);
      font-size: 0.95rem;
    }

    /* ---------- Productos ---------- */
    #productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 260px));
      gap: 24px;
      justify-content: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .producto {
      display: flex;
      flex-direction: column;
      min-width: 0;            /* evita que el contenido desborde la tarjeta */
      overflow: hidden;
      padding: 14px;
      text-align: left;
      border: 2px solid transparent;
      border-radius: 14px;
      background:
        linear-gradient(var(--superficie), var(--superficie)) padding-box,
        linear-gradient(120deg, var(--magenta), var(--violeta), var(--cyan), var(--violeta), var(--magenta)) border-box;
      background-size: 100% 100%, 300% 100%;
      background-repeat: no-repeat, repeat;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .producto:hover,
    .producto:focus-within {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(122, 77, 255, 0.45);
      animation: rgb 3s linear infinite;
    }

    @keyframes rgb { to { background-position: 0 0, 300% 0; } }

    /* Aquí estaba el problema: la imagen no tenía límite de tamaño */
    .producto img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 12px;
    }

    .producto h3 {
      margin: 0 0 6px;
      font-size: 0.95rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .producto .descripcion {
      margin: 0 0 12px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--texto-suave);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .producto .precio {
      margin: auto 0 12px;     /* empuja precio y botón al fondo de la tarjeta */
      color: var(--cyan);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .producto button { width: 100%; }

    /* ---------- Botones ---------- */
    button {
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #fff;
      background: linear-gradient(135deg, var(--magenta), var(--violeta));
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.1s ease, filter 0.2s ease;
    }

    button:hover {
      box-shadow: 0 0 18px rgba(255, 46, 136, 0.7);
      filter: brightness(1.1);
    }

    button:active { transform: scale(0.96); }

    button:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    button.vaciar {
      background: transparent;
      border: 2px solid var(--violeta);
      color: var(--texto);
    }

    /* ---------- Carrito ---------- */
    .carrito {
      margin: 40px auto 0;
      max-width: 460px;
      padding: 20px;
      text-align: left;
      background: var(--superficie);
      border-radius: 14px;
      border-left: 4px solid var(--cyan);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .carrito h2 { margin: 0 0 12px; font-size: 1.3rem; }

    .carrito ul {
      list-style: none;
      margin: 0 0 12px;
      padding: 0;
    }

    .carrito li {
      padding: 8px 0;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(167, 159, 196, 0.25);
    }

    .carrito li:last-child { border-bottom: 0; }

    .resumen {
      margin: 0 0 16px;
      padding-top: 12px;
      border-top: 2px solid rgba(167, 159, 196, 0.25);
    }

    .resumen p { margin: 4px 0; color: var(--texto-suave); }

    .resumen .total {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .carrito button { margin: 0 8px 8px 0; }

    @media (prefers-reduced-motion: reduce) {
      .producto, button { transition: none; }
      .producto:hover, .producto:focus-within { animation: none; transform: none; }
    }
  </style>
</head>
<body>
  <h1>🎮 TechGear - Periféricos Pro</h1>

  <p class="slogan">
    Potencia tu setup. Domina tu juego. ⚡🖥️
  </p>


  <div class="beneficios">
    <span>🚚 Envíos en Bogotá</span>
    <span>🔒 Compra segura</span>
    <span>📦 Seguimiento de pedido</span>
  </div>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🧾 Carrito de Compras</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Redragon Auriculares para juegos con cable USB con sonido envolvente 7.1",
        descripcion: "Micrófono con cancelación de ruido, luz RGB, soporte para auriculares, controladores de 1.575 in, sobre la oreja para PC, PS4.",
        precio: 98000,
        imagen: "https://m.media-amazon.com/images/I/61Eh7kqBHTL._AC_SY355_.jpg"
      },
      {
        id: 2,
        nombre: "GravaStar Teclado mecánico inalámbrico para juegos Mercury K1 75% con",
        descripcion: "Montaje de junta, interruptores lineales intercambiables en caliente, teclado de sonido cremoso, 2.4 GHz/USB-C/Bluetooth 5.0",
        precio: 354000,
        imagen: "https://m.media-amazon.com/images/I/6144lt2l5JL._AC_SY355_.jpg"
      },
      {
        id: 3,
        nombre: "Womier SK80 75% Keyboard with Color Multimedia Display Gaming Keyboard",
        descripcion: "Creamy Sound Mechanical Wired Hot Swappable Gasket RGB Custom Key board, Pre-lubed Stabilizer for Mac/Win, Black Kanagawa",
        precio: 140000,
        imagen: "https://m.media-amazon.com/images/I/71hdClN+RtL._AC_SY355_.jpg"
      },
      {
        id: 4,
        nombre: "Razer Viper V3 HyperSpeed - Ratón inalámbrico para juegos para PC, 2.89 oz",
        descripcion: "Sensor óptico de 30 K DPI, hasta 280 horas de duración de la batería, interruptores mecánicos Gen-2, 6 botones programables",
        precio: 280000,
        imagen: "https://m.media-amazon.com/images/I/61LI6E0sJwL._AC_SL1500_.jpg"
      },
      {
        id: 5,
        nombre: "Razer Basilisk V3 Customizable RGB Wired Ergonomic Gaming Mouse, Black",
        descripcion: "Interruptor de mouse para juegos más rápido, iluminación Chroma RGB, sensor óptico de 26K DPI, 11 botones programables",
        precio: 112000,
        imagen: "https://m.media-amazon.com/images/I/61AcT0ZuO3L._AC_SY355_.jpg"
      }
    ];


    /* ==============================
       CARRITO
    ================================ */

    const carrito = [];

    const contenedorProductos = document.getElementById("productos");
    const listaCarrito = document.getElementById("lista-carrito");
    const totalCarrito = document.getElementById("total");


    /* ==============================
       MOSTRAR PRODUCTOS
    ================================ */

    function mostrarProductos() {

      contenedorProductos.innerHTML = "";

      productos.forEach(prod => {

        const div = document.createElement("div");

        div.className = "producto";

        div.innerHTML = `
          <img src="${prod.imagen}" alt="${prod.nombre}">

          <h3>${prod.nombre}</h3>

          <p class="descripcion">
            ${prod.descripcion}
          </p>

          <p class="precio">
            ${prod.precio.toLocaleString("es-CO", {
              style: "currency",
              currency: "COP",
              minimumFractionDigits: 0
            })}
          </p>

          <button onclick="agregarAlCarrito(${prod.id})">
            Agregar al carrito
          </button>
        `;

        contenedorProductos.appendChild(div);

      });

    }


    /* ==============================
       AGREGAR AL CARRITO
    ================================ */

    function agregarAlCarrito(id) {

      const productoExistente =
        carrito.find(p => p.id === id);

      if (productoExistente) {

        productoExistente.cantidad++;

      } else {

        const producto =
          productos.find(p => p.id === id);

        carrito.push({
          ...producto,
          cantidad: 1
        });

      }

      actualizarCarrito();

    }


    /* ==============================
       ACTUALIZAR CARRITO
    ================================ */

    function actualizarCarrito() {

      listaCarrito.innerHTML = "";

      let total = 0;
      let totalItems = 0;

      carrito.forEach(item => {

        const li =
          document.createElement("li");

        const subtotal =
          item.precio * item.cantidad;

        li.textContent =
          `${item.nombre} x${item.cantidad} — ` +
          subtotal.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0
          });

        listaCarrito.appendChild(li);

        total += subtotal;
        totalItems += item.cantidad;

      });

      totalCarrito.textContent =
        total.toLocaleString("es-CO");

      actualizarTituloCarrito(totalItems);

    }


    /* ==============================
       CONTADOR DEL CARRITO
    ================================ */

    function actualizarTituloCarrito(cantidad) {

      const titulo =
        document.querySelector(".carrito h2");

      titulo.textContent =
        `🧾 Carrito de Compras (${cantidad})`;

    }


    /* ==============================
       VACIAR CARRITO
    ================================ */

    function vaciarCarrito() {

      if (carrito.length === 0) {

        alert("🛒 El carrito ya está vacío.");

        return;

      }

      if (
        confirm(
          "¿Estás seguro de que quieres vaciar el carrito?"
        )
      ) {

        carrito.length = 0;

        actualizarCarrito();

      }

    }


    /* ==============================
       FINALIZAR COMPRA
    ================================ */

    function finalizarCompra() {

      if (carrito.length === 0) {

        alert(
          "🛒 Tu carrito está vacío. Agrega productos antes de finalizar la compra."
        );

        return;

      }

      alert(
        "🎉 ¡Pedido simulado confirmado!\n\n" +
        "En un eCommerce real, ahora entrarían en acción " +
        "el backend, la pasarela de pago y la logística."
      );

      carrito.length = 0;

      actualizarCarrito();

    }


    /* ==============================
       INICIAR TIENDA
    ================================ */

    mostrarProductos();
  </script>
</body>
</html>
